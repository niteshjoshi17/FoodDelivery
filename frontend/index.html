<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Backend Frontend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 16px;
            color: #666;
        }
        #data {
            margin-top: 20px;
            padding: 15px;
            background: #eef;
            border-radius: 5px;
            display: none; /* Initially hidden */
            font-family: monospace;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Go Backend App</h1>
        <p>This is a simple frontend UI connected to a Go backend.</p>

        <button onclick="fetchData()">Fetch API Data</button>
        
        <div class="loader" id="loader"></div>

        <div id="data"></div>
    </div>

    <script>
        function fetchData() {
            document.getElementById('data').style.display = "none";
            document.getElementById('loader').style.display = "block";

            fetch('http://localhost:9090/api/data')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('data').innerText = JSON.stringify(data, null, 2);
                    document.getElementById('data').classList.remove('error');
                    document.getElementById('data').style.display = "block";
                })
                .catch(error => {
                    document.getElementById('data').innerText = "Error fetching data: " + error.message;
                    document.getElementById('data').classList.add('error');
                    document.getElementById('data').style.display = "block";
                })
                .finally(() => {
                    document.getElementById('loader').style.display = "none";
                });
        }
    </script>
</body>
</html>
